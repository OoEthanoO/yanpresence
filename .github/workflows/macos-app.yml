name: macOS app

on:
  workflow_dispatch:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - 'bin/**'
      - 'src/**'
      - 'scripts/**'
      - 'macos/**'
      - 'installer/**'
      - 'assets/**'
      - 'package*.json'
      - 'test/**'
      - '.github/workflows/macos-app.yml'

permissions:
  contents: read

jobs:
  build:
    # Each architecture is built and tested on its own hardware: the build
    # runs the bundled programs as a check, and the package test runs the app.
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Match release tag to package version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="$(plutil -extract version raw -o - package.json)"
          if [ "$RELEASE_TAG" != "v$version" ]; then
            echo "Tag $RELEASE_TAG must match package.json version v$version" >&2
            exit 1
          fi
      - name: Build pinned macOS app
        run: ./scripts/build-macos.sh --arch ${{ matrix.arch }}
      - name: Test with bundled Node
        # On PATH as well, for the tests that stand in for a program with a
        # `#!/usr/bin/env node` script.
        run: |
          bundled="$PWD/.build/macos-${{ matrix.arch }}/yanpresence.app/Contents/MacOS"
          PATH="$bundled:$PATH" "$bundled/node" --test test/*.test.js
      - name: Install, run, upgrade and quit an isolated test identity
        run: ./scripts/test-macos-package.sh --arch ${{ matrix.arch }}
      - name: Upload macOS disk image
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: yanpresence-macos-${{ matrix.arch }}
          path: |
            dist/yanpresence-*-macos-${{ matrix.arch }}.dmg
            dist/yanpresence-*-macos-${{ matrix.arch }}.dmg.sha256
          if-no-files-found: error
      - name: Upload package test logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-package-test-logs-${{ matrix.arch }}
          path: .build/Package Smoke */results/

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Shared with the Windows installer's release job, across workflows: both
    # attach to one draft release, and two creating it at once would make two.
    concurrency:
      group: release-${{ github.ref_name }}
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: yanpresence-macos-*
          path: dist
          merge-multiple: true
      # The website links to releases/latest/download/<name>, which GitHub
      # resolves only for an exact asset name. The versioned file changes name
      # every release, so ship the same bytes under one name that never does.
      - name: Add version-less copies for the website's download links
        run: |
          shopt -s nullglob
          for arch in arm64 x64; do
            versioned=(dist/yanpresence-*-macos-$arch.dmg)
            if [ "${#versioned[@]}" -ne 1 ]; then
              echo "Expected exactly one versioned $arch disk image, found ${#versioned[@]}: ${versioned[*]}" >&2
              exit 1
            fi
            cp "${versioned[0]}" "dist/yanpresence-macos-$arch.dmg"
            (cd dist && sha256sum "yanpresence-macos-$arch.dmg" > "yanpresence-macos-$arch.dmg.sha256")
          done
      - name: Attach disk images to a draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --draft --title "yanpresence $TAG" --generate-notes
          fi
          gh release upload "$TAG" dist/* --clobber
